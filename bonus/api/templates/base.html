<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ASL Vision{% endblock %} · ASL Recognition</title>
  <link rel="stylesheet" href="/static/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/>
        <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/>
        <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/>
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
      </svg>
      ASL<span class="grad-text">Vision</span>
    </a>
    <ul class="nav-links">
      <li><a href="/"        class="nav-link {{ 'active' if active == 'home'    }}">Home</a></li>
      <li><a href="/predict" class="nav-link nav-cta {{ 'active' if active == 'predict' }}">Try the Model</a></li>
    </ul>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
  <div class="footer-inner">
    <p>CIE 552 — Computer Vision &nbsp;·&nbsp; Zewail City of Science and Technology &nbsp;·&nbsp; Spring 2026</p>
  </div>
</footer>

<script src="/static/js/app.js" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
